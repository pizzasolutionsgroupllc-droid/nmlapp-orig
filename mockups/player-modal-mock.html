<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Modal Mock v5</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0f0f1a;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 20px;
}

/* ── Modal ── */
.modal {
  background: #1a1a2e;
  border: 1px solid #252540;
  border-radius: 14px;
  width: 100%;
  max-width: 560px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 28px 70px rgba(0,0,0,.8);
  color: #dde;
  scrollbar-width: thin;
  scrollbar-color: #2a2a45 transparent;
}

/* ── Header ── */
.pm-header {
  display: flex; align-items: flex-start; gap: 11px;
  padding: 13px 13px 11px;
  border-bottom: 1px solid #1e1e38;
  position: sticky; top: 0; background: #1a1a2e; z-index: 10;
}
.pm-ovr {
  min-width: 50px; height: 50px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 800; color: #fff;
  flex-shrink: 0; letter-spacing: -1px;
}
.tier-elite { background: linear-gradient(135deg,#c084fc,#7c3aed); }
.tier-great { background: linear-gradient(135deg,#60a5fa,#2563eb); }
.tier-good  { background: linear-gradient(135deg,#34d399,#059669); }
.tier-avg   { background: linear-gradient(135deg,#fcd34d,#d97706); }
.tier-below { background: linear-gradient(135deg,#fb923c,#ea580c); }
.tier-poor  { background: linear-gradient(135deg,#f87171,#dc2626); }

.pm-name-block { flex: 1; min-width: 0; }
.pm-name {
  font-size: 16px; font-weight: 700; color: #fff;
  line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pm-team-row {
  display: flex; align-items: center; flex-wrap: wrap;
  margin-top: 4px; font-size: 11px; line-height: 1.4;
}
.pm-team-pos  { color: #7ab4ff; font-weight: 700; }
.pm-team-sep  { color: #2e2e4a; margin: 0 4px; }
.pm-team-nml  { color: #6ecf6e; }
.pm-team-nfl  { color: #c9a840; }
.pm-meta-row {
  display: flex; flex-wrap: wrap; align-items: center;
  gap: 3px 0; margin-top: 3px;
}
.pm-badge {
  font-size: 10px; font-weight: 700;
  padding: 1px 6px; border-radius: 4px; white-space: nowrap;
}
.badge-xf   { background:#3d2600; color:#ffb830; border:1px solid #6a4400; }
.badge-ss   { background:#3a1800; color:#ff8c42; border:1px solid #6a3000; }
.badge-norm { background:#242438; color:#888; }
.meta-sep { color:#2e2e4a; font-size:11px; margin: 0 4px; }
.meta-item { font-size:11px; color:#778; }
.meta-item b { color:#aab; }
.pm-close {
  background:none; border:none; color:#444; cursor:pointer;
  font-size:17px; padding:4px; flex-shrink:0; line-height:1;
}
.pm-close:hover { color:#fff; }

/* ── Body ── */
.pm-body { padding: 10px 12px 14px; }

/* ── Stat sections: flex-wrap, each col sizes to content ── */
.stat-wrap {
  display: flex; flex-wrap: wrap; gap: 7px;
  align-items: flex-start; margin-bottom: 10px;
}
.stat-col {
  background: #141426; border-radius: 8px;
  padding: 6px 10px 8px;
  width: max-content; min-width: 0; flex-shrink: 0;
}
.stat-col-title {
  font-size: 9px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .07em;
  color: #4a4a68; margin-bottom: 5px;
  border-bottom: 1px solid #1c1c34; padding-bottom: 4px;
  white-space: nowrap;
}
.stat-row {
  display: flex; align-items: baseline;
  gap: 5px; line-height: 1.7; white-space: nowrap;
}
.sv {
  font-size: 13px; font-weight: 700;
  width: 24px; text-align: right;
  font-variant-numeric: tabular-nums; flex-shrink: 0;
}
.sl { font-size: 11px; color: #4a4a65; }

/* ── Rating color spectrum ── */
.sv.r-elite { color: #c084fc; }
.sv.r-great { color: #60a5fa; }
.sv.r-good  { color: #34d399; }
.sv.r-avg   { color: #fcd34d; }
.sv.r-below { color: #fb923c; }
.sv.r-poor  { color: #f87171; }

/* ── Abilities ── */
.section-label {
  font-size: 9px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .08em; color: #3a3a55; margin: 10px 0 6px;
}
/*
  2-column grid. justify-items:start prevents cards from stretching.
  width:min-content on the card + white-space:nowrap on the title
  sets card width = title width; description wraps within it.
*/
.abilities-wrap {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  justify-items: start;
  align-items: start;
  margin-bottom: 10px;
}
.ability-card {
  width: min-content;
  background: #141426; border-radius: 7px;
  padding: 7px 9px; border-left: 3px solid #333;
}
.ability-card.xf { border-color: #b07800; }
.ability-card.ss { border-color: #a04820; }
.ability-name {
  white-space: nowrap; /* this line drives the card width */
  font-size: 11px; font-weight: 700; color: #dde;
  display: flex; align-items: center; gap: 5px;
  margin-bottom: 3px;
}
.ability-type {
  font-size: 8px; font-weight: 700; flex-shrink: 0;
  padding: 1px 4px; border-radius: 3px; text-transform: uppercase;
}
.ability-type.xf { background:#3d2600; color:#ffb830; }
.ability-type.ss { background:#3a1800; color:#ff8c42; }
.ability-desc {
  /* Fills and wraps within the width set by ability-name */
  display: block; white-space: normal;
  font-size: 10px; color: #556; line-height: 1.4;
}

/* ── Footer: two compact rows ── */
.pm-footer {
  border-top: 1px solid #1c1c34;
  margin-top: 8px; padding-top: 7px;
  display: flex; flex-direction: column; gap: 4px;
}
.foot-row {
  display: flex; flex-wrap: wrap; align-items: baseline;
  font-size: 11px; color: #778; line-height: 1.5;
}
.foot-sep { color: #2e2e4a; margin: 0 5px; }
.foot-lbl { font-size: 9px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .05em; color: #3d3d5a; margin-right: 3px; }
.foot-val { color: #aab; }
.foot-divider { border: none; border-top: 1px solid #1c1c34; margin: 1px 0; }

/* ── Controls ── */
.controls {
  position: fixed; top: 12px; right: 12px;
  display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; max-width: 260px;
}
.ctrl-btn {
  background:#14142a; color:#888; border:1px solid #2a2a45;
  padding:4px 9px; border-radius:6px; cursor:pointer; font-size:11px;
}
.ctrl-btn.active { background:#220e4a; border-color:#7c3aed; color:#c084fc; }
.note {
  position:fixed; bottom:10px; left:50%; transform:translateX(-50%);
  background:#0f0f1a; border:1px solid #2a2a45; color:#444;
  font-size:10px; padding:5px 14px; border-radius:20px; white-space:nowrap; z-index:99;
}
</style>
</head>

// ── Helpers ──────────────────────────────────────────────────────────────────
function rClass(v) {
  if (v >= 95) return 'r-elite';
  if (v >= 88) return 'r-great';
  if (v >= 80) return 'r-good';
  if (v >= 72) return 'r-avg';
  if (v >= 65) return 'r-below';
  return 'r-poor';
}
function ovrTier(v) {
  if (v >= 95) return 'tier-elite';
  if (v >= 88) return 'tier-great';
  if (v >= 80) return 'tier-good';
  if (v >= 72) return 'tier-avg';
  if (v >= 65) return 'tier-below';
  return 'tier-poor';
}
function sectionMax(rows) { return Math.max(...rows.map(r => r.v), 0); }
function sectionAvg(rows) {
  // avg excludes 0s so sections with some 0s still sort correctly
  const v = rows.filter(r => r.v > 0);
  return v.length ? v.reduce((s,r) => s+r.v, 0)/v.length : 0;
}
function devBadge(dev) {
  if (dev === 'X-Factor') return `<span class="pm-badge badge-xf">⚡ X-Factor</span>`;
  if (dev === 'Superstar') return `<span class="pm-badge badge-ss">★ Superstar</span>`;
  if (dev) return `<span class="pm-badge badge-norm">${dev}</span>`;
  return '';
}

// ── Build one stat column ─────────────────────────────────────────────────────
// Show section if max >= 40. Show EVERY row, no per-row filtering.
function buildCol(title, rows) {
  if (sectionMax(rows) < 40) return null;
  const rowsHtml = rows
    .map(r => `<div class="stat-row"><span class="sv ${rClass(r.v)}">${r.v}</span><span class="sl">${r.l}</span></div>`)
    .join('');
  return {
    title,
    html: `<div class="stat-col"><div class="stat-col-title">${title}</div>${rowsHtml}</div>`,
    avg: sectionAvg(rows),
    max: sectionMax(rows)
  };
}

// ── Full render ───────────────────────────────────────────────────────────────
function render(p) {
  const allCols = Object.entries(p.sections)
    .map(([t,rows]) => buildCol(t, rows))
    .filter(Boolean);

  const gen  = allCols.find(c => c.title === 'General');
  const rest = allCols.filter(c => c.title !== 'General').sort((a,b) => b.avg - a.avg);
  const colsHtml = [gen, ...rest].filter(Boolean).map(c => c.html).join('');

  const abHtml = p.abilities.map(a => `
    <div class="ability-card ${a.type}">
      <div class="ability-name">
        ${a.name}<span class="ability-type ${a.type}">${a.type==='xf'?'X-Factor':'Superstar'}</span>
      </div>
      <div class="ability-desc">${a.desc}</div>
    </div>`).join('');

  return `
  <div class="pm-header">
    <div class="pm-ovr ${ovrTier(p.ovr)}">${p.ovr}</div>
    <div class="pm-name-block">
      <div class="pm-name">${p.name}</div>
      <div class="pm-team-row">
        <span class="pm-team-pos">${p.pos}</span>
        <span class="pm-team-sep">,</span>
        <span class="pm-team-nml">NML-${p.nml}</span>
        <span class="pm-team-sep">,</span>
        <span class="pm-team-nfl">NFL-${p.nflShort}</span>
      </div>
      <div class="pm-meta-row">
        <span class="meta-item"><b>${p.age}</b> yrs old</span>
        <span class="meta-sep">·</span>
        <span class="meta-item"><b>${p.yrs}</b> yrs pro</span>
        <span class="meta-sep">·</span>
        <span class="meta-item">#<b>${p.num}</b></span>
        <span class="meta-sep">·</span>
        ${devBadge(p.dev)}
      </div>
    </div>
    <button class="pm-close">✕</button>
  </div>
  <div class="pm-body">
    <div class="stat-wrap">${colsHtml}</div>
    ${p.abilities.length ? `<div class="section-label">Abilities</div><div class="abilities-wrap">${abHtml}</div>` : ''}
    <div class="pm-footer">
      <div class="foot-row">
        <span class="foot-lbl">College</span><span class="foot-val">${p.college}</span>
        <span class="foot-sep">·</span>
        <span class="foot-lbl">Draft</span><span class="foot-val">${p.draft}</span>
        <span class="foot-sep">·</span>
        <span class="foot-lbl">DOB</span><span class="foot-val">${p.dob}</span>
      </div>
      <hr class="foot-divider">
      <div class="foot-row">
        <span class="foot-lbl">Contract</span><span class="foot-val">${p.contract}</span>
        <span class="foot-sep">·</span>
        <span class="foot-lbl">AAV</span><span class="foot-val">${p.aav}</span>
        <span class="foot-sep">·</span>
        <span class="foot-lbl">Cap Hit</span><span class="foot-val">${p.capHit}</span>
        <span class="foot-sep">·</span>
        <span class="foot-lbl">Yrs Left</span><span class="foot-val">${p.yrsLeft}</span>
      </div>
    </div>
  </div>`;
}

function show(key) {
  document.getElementById('modal').innerHTML = render(P[key]);
  document.querySelectorAll('.ctrl-btn').forEach(b =>
    b.classList.toggle('active', b.onclick.toString().includes(`'${key}'`))
  );
}
show('hunter');
</script>
</body>
</html>
